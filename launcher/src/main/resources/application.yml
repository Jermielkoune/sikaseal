# =========================================================
# 1. Configuration du Serveur Web
# =========================================================
server:
  port: 8082
  servlet:
    context-path: /bank-api # Toutes tes routes commenceront par http://localhost:8080/bank-api

# =========================================================
# 2. Identité de l'application
# =========================================================
spring:
  application:
    name: hexagonal-bank-kata
  datasource:
    url: jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# =========================================================
# 3. Métadonnées de l'application
# (Visible via l'endpoint /actuator/info)
# =========================================================
info:
  app:
    name: Bank Kata API
    description: Une API bancaire en architecture hexagonale
    version: 1.0.0

# =========================================================
# 4. Propriétés métiers custom
# =========================================================
bank:
  rules:
    default-currency: EUR

# =========================================================
# 5. Monitoring & Actuator
# =========================================================
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

# =========================================================
# 7. Logs
# =========================================================
logging:
  config: classpath:log4j2.xml
  level:
    org.springframework.web: INFO
