# Identité & endpoint SonarCloud
# IMPORTANT : l'identité est fournie par la CI Azure DevOps.
# sonar.projectKey = $(SONAR_PROJECT_KEY)
# sonar.organization = $(SONAR_ORG)
# sonar.host.url = $(SONAR_HOST_URL)

# --- SUPPRIMÉ : Inutile avec Maven (mvn sonar:sonar trouve les dossiers tout seul) ---
# sonar.sources=**/src/main/java
# sonar.tests=**/src/test/java
# sonar.test.inclusions=**/src/test/**/*.*

# Rapport JaCoCo agrégé multi-modules (référence pour le coverage global)
sonar.coverage.jacoco.xmlReportPaths=launcher/target/site/jacoco-aggregate/jacoco.xml
sonar.java.codeCoveragePlugin=jacoco

sonar.sourceEncoding=UTF-8

# Exclusions génériques (multi-modules)
# NB: sonar.exclusions retire les fichiers de l'analyse (odeurs/bugs). On l'utilise ici uniquement
# pour ignorer les artefacts de build.
sonar.exclusions=**/target/**,**/generated-sources/**,**/generated-test-sources/**

# Exclusions de couverture (laisse les fichiers analysés mais ne les compte pas dans le coverage)
# Objectif : Quality Gate standard sur un scope maîtrisé (code métier testé), sans pénaliser
# le bootstrap Spring, la configuration, les DTOs et les entités JPA.
sonar.coverage.exclusions=launcher/**,**/*Application.java,**/*Config*.java,**/*Configuration*.java,**/config/**,**/dto/**,**/*Dto.java,**/*DTO.java,**/*Entity.java,exposition/**,infrastructure/**

sonar.issue.ignore.multicriteria = S6437,S125,S2187,S3437,S4502,S4684,S5145,S7027-domain,S7027-dto,UndocumentedApi

# Rule S6437 hardcoded passwords
sonar.issue.ignore.multicriteria.S6437.resourceKey = **/src/main/resources/config/*
sonar.issue.ignore.multicriteria.S6437.ruleKey = java:S6437

# Rule S2187 gatling tests
sonar.issue.ignore.multicriteria.S2187.resourceKey = **/src/test/java/gatling/**/*
sonar.issue.ignore.multicriteria.S2187.ruleKey = java:S2187

# Rule S3437 JPA-managed field cannot be transient
sonar.issue.ignore.multicriteria.S3437.resourceKey = **/*.java
sonar.issue.ignore.multicriteria.S3437.ruleKey = squid:S3437

# Rule S4502 CSRF attack
sonar.issue.ignore.multicriteria.S4502.resourceKey = **/*.java
sonar.issue.ignore.multicriteria.S4502.ruleKey = java:S4502

# Rule S4684
sonar.issue.ignore.multicriteria.S4684.resourceKey = **/*.java
sonar.issue.ignore.multicriteria.S4684.ruleKey = java:S4684

# Rule S5145 log filter
sonar.issue.ignore.multicriteria.S5145.resourceKey = **/*.java
sonar.issue.ignore.multicriteria.S5145.ruleKey = javasecurity:S5145

# Rule S7027 ignored for domain (ATTENTION AU NOM DU PACKAGE)
sonar.issue.ignore.multicriteria.S7027-domain.resourceKey = **/src/main/java/com/sikaseal/bank/kata/domain/**/*
sonar.issue.ignore.multicriteria.S7027-domain.ruleKey = javaarchitecture:S7027

# Rule S7027 ignored for dtos (ATTENTION AU NOM DU PACKAGE)
sonar.issue.ignore.multicriteria.S7027-dto.resourceKey = **/src/main/java/com/sikaseal/bank/kata/exposition/dto/**/*
sonar.issue.ignore.multicriteria.S7027-dto.ruleKey = javaarchitecture:S7027

# Rule UndocumentedApi (Clean code guidelines)
sonar.issue.ignore.multicriteria.UndocumentedApi.resourceKey = **/*.java
sonar.issue.ignore.multicriteria.UndocumentedApi.ruleKey = squid:UndocumentedApi

# Rule S125 (XML comments)
sonar.issue.ignore.multicriteria.S125.resourceKey = **/src/main/resources/logback-spring.xml
sonar.issue.ignore.multicriteria.S125.ruleKey = xml:S125